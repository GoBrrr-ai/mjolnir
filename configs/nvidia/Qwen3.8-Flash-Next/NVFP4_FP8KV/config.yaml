# Qwen3.8-Flash-Next E1/E4 control: the NVFP4_SFP8 recipe with the KV cache on
# fp8 e4m3 (stock QSA writer/reader, no code needed) — isolates the KV-dtype
# axis. Everything else identical to NVFP4_SFP8; see that config's header.
#
# E1 ladder: NVFP4_SFP8 (bf16) -> NVFP4_FP8KV (fp8) -> NVFP4_MJOLNIR_QSA
# (fp8 + the Mjolnir QSA impl). The fp8 step also buys ~2x KV tokens on the
# 12 QSA cache-bearing layers; quality per bench accuracy (E4 gate).
model: nvidia/Qwen3.8-Flash-Next-NVFP4
revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
served-model-name: nvidia/Qwen3.8-Flash-Next
language-model-only: true

engram-config:
  disk_offload: true

dtype: bfloat16
performance-mode: throughput
optimization-level: 3
compilation-config:
  cudagraph_mode: PIECEWISE
  cudagraph_num_of_warmups: 5

max-num-seqs: 1
max-model-len: 262144
max-num-batched-tokens: 8192
gpu-memory-utilization: 0.75

# THE delta vs NVFP4_SFP8: fp8 KV (QSA layers accept BF16 or fp8 e4m3).
kv-cache-dtype: fp8_e4m3
mamba-cache-dtype: bfloat16
mamba-ssm-cache-dtype: bfloat16

async-scheduling: true
enable-flashinfer-autotune: false

enable-auto-tool-choice: true
tool-call-parser: qwen3_xml
reasoning-parser: qwen3

speculative-config:
  method: mtp
  num_speculative_tokens: 3
