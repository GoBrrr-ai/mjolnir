# NVFP4_FP6 — E4: the recipe on packed-fp6 QSA pools, K=3 (the fp6 smoke + the honest composite twin)
# (the E4 fp6 pair: mjolnir.qsa_impl writes/reads e2m3; thor-qwen4-qsa-fp6.patch)
# Qwen3.8-Flash-Next E1 treatment: NVFP4_FP8KV plus the Mjolnir QSA decode
# swap (MJOLNIR_ATTN_QSA) — the fp8 cache is the swap's precondition
# (qsa_impl gates on fp8; bf16 falls back to stock on every step).
# One delta vs NVFP4_FP8KV: the MJOLNIR_ATTN_QSA=1 line here.
model: nvidia/Qwen3.8-Flash-Next-NVFP4
