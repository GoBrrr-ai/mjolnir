# FP4LOCAL — Qwen3.8-Flash-Next on nvidia/Qwen3.8-Flash-Next-FP4-Local (QAD-trained:
# routed experts NVFP4 with CSF-compressed scales, side layers MXFP8, PLE
# table NVFP4), one sequence: the contributor's recipe "R8b + C3 + C2", the
# faster of the two. On Thor with vLLM 0.34: 45.8 / 45.7 / 50.2 / 46.7 decode
# t/s at 0 / 8K / 32K / 128K context, Tool Eval 90.9 (hard mode 86.6, 2
# trials). Same stack as NVFP4_SFP8 except: the side layers are MXFP8 as
# shipped, so no online side FP8 / indexer split; the pinned CUTLASS MXFP8
# tactic of both recipes (MJOLNIR_MXFP8_TACTIC=256:8, C3, bit-identical) covers
# them here besides the HC up projections. Loading needs the CSF-compressed scales (#64312 + #64869,
# upstream since vLLM 0.34) and the image patch 64739 (the shards sit under
# tensors/; this Hub-snapshot load path is not yet run on a device). Every
# switch but the PLE disk table is in the .env.
#
# Before the first `mjolnir serve up`, install the page-cache grant once
# (`mjolnir grant-permissions`; see NVFP4_SFP8).
# Attention: QSA on 12 layers + Gated-DeltaNet on 36; none is set (see
# NVFP4_SFP8).
model: nvidia/Qwen3.8-Flash-Next-FP4-Local
revision: b9ce18a6887e18c089fdea8509a33e63429a3300
served-model-name: nvidia/Qwen3.8-Flash-Next
language-model-only: true
# PLE n-gram table read from the checkpoint files (vLLM's disk table, its
# on/off switch); the .env's MJOLNIR_PLE_DISK_CACHE_GB puts mjolnir's slot-pool
# reader in front of it.
engram-config:
  disk_offload: true

dtype: bfloat16
performance-mode: throughput
optimization-level: 3
# PIECEWISE only: the PLE lookup and QSA are host-side eager breaks of the
# breakable CUDA graph (VLLM_USE_BREAKABLE_CUDAGRAPH=1 in the .env); the
# drafter's decode passes still replay FULL graphs.
compilation-config:
  cudagraph_mode: PIECEWISE
  cudagraph_num_of_warmups: 5

# ── Memory: one sequence, 256K context, share 0.75 (KV 417K-434K tokens on
#    Thor with 0.34, varying per start)
max-num-seqs: 1
max-model-len: 262144
max-num-batched-tokens: 8192
gpu-memory-utilization: 0.75

kv-cache-dtype: auto   # = the model dtype, bfloat16 (the recipe's --kv-cache-dtype bfloat16)
mamba-cache-dtype: bfloat16
mamba-ssm-cache-dtype: bfloat16

async-scheduling: true
enable-flashinfer-autotune: false   # the CUTLASS MXFP8 / FP8 tactic choice stays deterministic

enable-auto-tool-choice: true
tool-call-parser: qwen3_xml
reasoning-parser: qwen3

# MTP K=3: K=4 measured no better (an extra verify token reads more distinct
# experts); K=5 could not start on 0.33 (the QSA ring capacity must divide the
# attention block size: 848 tokens there, 832 on 0.34; not retried).
speculative-config:
  method: mtp
  num_speculative_tokens: 3
