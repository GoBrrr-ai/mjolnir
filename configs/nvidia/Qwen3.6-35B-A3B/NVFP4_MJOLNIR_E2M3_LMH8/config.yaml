# NVFP4_MJOLNIR_E2M3_LMH8 — Qwen3.6-35B-A3B NVFP4 on Mjolnir: NVFP4_DFLASH's
# flags plus the Mjolnir feature set, nothing else:
#   MJOLNIR attention on the 10 full-attention layers (head_dim 256, GQA 16:2)
#   fp6 (e2m3) KV with calibrated per-(layer, KV head) scales (../kv_scales.json)
#   fp8 lm_head            (.env MJOLNIR_LM_HEAD=fp8)
#   MTP, 5 drafts          (built-in head; K=5 x GQA 8 = 48 rows: two 32-row kernel tiles)
# No draft vocab (VT): MJOLNIR_DRAFT_VOCAB on this MoE adds ~40 GB at startup
# and trips the memory guard (2026-10-16); open until that is fixed.
model: nvidia/Qwen3.6-35B-A3B-NVFP4
served-model-name: nvidia/Qwen3.6-35B-A3B-NVFP4

quantization: modelopt
trust-remote-code: true

# ── Memory: same shape as NVFP4_DFLASH (single user, embed/rerank alongside) ─
max-model-len: 262144
max-num-seqs: 1
gpu-memory-utilization: 0.45

enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
reasoning-parser: qwen3

# ── Attention ────────────────────────────────────────────────────────────
# Mjolnir decode kernel on decode steps, FlashAttention 4 for prefill / mixed
# steps; `mjolnir serve` adds VLLM_KV_CACHE_LAYOUT=HND for MJOLNIR configs.
attention-backend: MJOLNIR

# ── KV Cache: fp6 e2m3 (25% fewer KV bytes than fp8) ─────────────────────
# Scales: `mjolnir calibrate` on an fp8-KV MJOLNIR config writes
# ../kv_scales.json; `mjolnir serve` points MJOLNIR_ATTN_KV_SCALES at it.
kv-cache-dtype: fp6_e2m3
kv-cache-dtype-skip-layers: sliding_window

# ── Speculative Decoding — MTP (built-in head), K=5 ─────────────────────
speculative-config:
  method: mtp
  num_speculative_tokens: 5

# Keep the Qwen3.8 configs' extras out (performance-mode throughput,
# optimization-level 3, 16K batched tokens, TORCH_SDPA ViT, mamba align):
# NVFP4_DFLASH did not come up with them, and they are untested here.
