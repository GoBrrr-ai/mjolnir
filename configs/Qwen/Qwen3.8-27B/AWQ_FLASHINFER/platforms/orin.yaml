# AGX Orin 64GB — the platform tuning the platform-neutral config.yaml does
# not set. The board's resident host usage (desktop + agent infra, ~12 GiB)
# caps gpu-memory-utilization: 0.72 leaves a ~2 GiB startup cushion at the
# free-memory check; the pool still holds a single 190K context (the
# 5-sequence extreme degrades to queueing). Same value as AWQ_MJOLNIR's
# overlay — the e2e legs must be memory-comparable. And
# the 8K token batch with a 32-token prefix-match unit is the Orin scheduler
# tuning (smaller prefill chunks and finer prefix blocks for its memory
# bandwidth). This is the config's only overlay: it exists on Orin only.
max-num-seqs: 5
max-model-len: 190K
max-num-batched-tokens: 8K
gpu-memory-utilization: 0.72
prefix-match-unit: 32
