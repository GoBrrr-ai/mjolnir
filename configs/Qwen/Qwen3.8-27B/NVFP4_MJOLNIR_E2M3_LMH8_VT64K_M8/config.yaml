# NVFP4_MJOLNIR_E2M3_LMH8_VT64K_M8 — EXPERIMENT (opt-in): NVFP4_MJOLNIR_E2M3_LMH8_VT64K
# plus MJOLNIR_MTP_LAYER=fp8 — the drafter's own Linear weights (the MTP layer + its
# eh_proj fc, ~0.9 GB bf16 re-read on EVERY draft step) quantized to e4m3 per row at
# load: −2.25 GB/step of weight traffic at K=5 (≈ −10% step time). Drafter-only, so
# verification stays lossless; acceptance may shift a little — measure before adopting:
#   mjolnir verify spec --legs mjolnir:NVFP4_MJOLNIR_E2M3_LMH8_VT64K,mjolnir:NVFP4_MJOLNIR_E2M3_LMH8_VT64K_M8 \
#     --drafts 5 --concurrency 1
# The batch→K schedule below is INERT at B≤2 (K stays 5) so that A/B is clean; it only
# engages at B≥3, where its own effect is a `bench ab` question.
# YAML is otherwise identical to NVFP4_MJOLNIR_E2M3_LMH8_VT64K; the switches are env
# vars in the .env sidecar (MJOLNIR_LM_HEAD / MJOLNIR_DRAFT_VOCAB[_SIZE] as there,
# plus MJOLNIR_MTP_LAYER).
model: QUASAR-QAT/Qwen3.8-27B-QUASAR-NVFP4
served-model-name: Qwen/Qwen3.8-27B

dtype: bfloat16

performance-mode: throughput
optimization-level: 3
compilation-config:
  cudagraph_num_of_warmups: 5
  custom_ops:
    - +rotary_embedding
  pass_config:
    eliminate_noops: true
    fuse_allreduce_rms: false

disable-custom-all-reduce: true
trust-remote-code: true
enforce-eager: false

max-num-seqs: 8
max-model-len: 200K
max-num-batched-tokens: 16K
gpu-memory-utilization: 0.80

enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
reasoning-parser: qwen3

# ── Attention / linear backends ─────────────────────────────────────────────
attention-backend: MJOLNIR
enable-flashinfer-autotune: true
mm-encoder-attn-backend: TORCH_SDPA   # SM110 ViT PTX-crash workaround (vLLM issue #38411)
linear-backend: auto                  # do NOT hardcode flashinfer-cutlass — that's the RTX5090/SM120 GEMM path, not SM110

# ── KV Cache ─────────────────────────────────────────────────────────────
kv-cache-dtype: fp6_e2m3
kv-cache-dtype-skip-layers: sliding_window
mamba-cache-mode: align
mamba-cache-dtype: bfloat16
mamba-ssm-cache-dtype: bfloat16

# ── Multimodal ─────────────────────────────────────────────────────────────
language-model-only: false
mm-encoder-tp-mode: data
mm-processor-cache-type: shm

# ── Caching & Scheduling ─────────────────────────────────────────────────
enable-prefix-caching: true
enable-chunked-prefill: true
async-scheduling: true

# ── Speculative Decoding — MTP (built-in head) ────────────────────────────
# K=5 at B≤2 (identical to the flagship — the fp8-layer A/B runs at B=1);
# K=4 at B≥3: at higher batch the draft steps batch all requests anyway and
# the marginal acceptance at deep positions no longer pays its traffic on
# Thor's bus. The schedule is a first-class SpeculativeConfig field
# (scheduler.py:309, cudagraph-aware).
speculative-config:
  method: mtp
  num_speculative_tokens: 5
  num_speculative_tokens_per_batch_size: [[1, 2, 5], [3, 64, 4]]

# ── Generation defaults (Qwen3.8 card's documented Thinking-mode preset) ────
override-generation-config:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0

# ── Chat Template ──────────────────────────────────────────────────────────
default-chat-template-kwargs:
  reasoning_effort: medium
  preserve_thinking: true
  enable_thinking: true

chat-template: /configs/Qwen/Qwen3.8_chat_template.jinja
