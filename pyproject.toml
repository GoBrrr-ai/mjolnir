# Workspace root (not published). The repo ships two independently
# versioned PyPI distributions:
#
#   src/mjolnir/      -> mjolnir-kernel   (import `mjolnir`: the decode kernel
#                                          + the vLLM `MJOLNIR` attention backend)
#   src/mjolnir-cli/  -> mjolnir-cli      (import `mjolnir_cli`: the `mjolnir`
#                                          command — serve / verify / bench / plot)
#
# `uv sync` installs both (editable) plus the dev tools; `uv run mjolnir ...`
# then runs the CLI from the checkout.

[project]
name = "mjolnir-workspace"
version = "0"
description = "Mjolnir monorepo root — not published (see src/mjolnir and src/mjolnir-cli)."
requires-python = ">=3.12"
dependencies = [
    "mjolnir-cli[plot]",
    "mjolnir-kernel",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty==0.0.91",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/mjolnir", "src/mjolnir-cli"]

[tool.uv.sources]
mjolnir-cli = { workspace = true }
mjolnir-kernel = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Beyond the defaults (E/F): modernization (UP), bug-prone patterns (B),
# blind excepts (BLE — every broad except must carry a `noqa` with its
# rationale), simplification (SIM), comprehension/collection style (C4, PIE,
# PERF, FURB), return-flow (RET), import conventions (ICN), dead code (ERA),
# datetime handling (DTZ) and the RUF misc set. Deliberately NOT selected:
#   E501  — ruff format owns wrapping; the file-length ratchet owns size
#   RUF001-003 — box-drawing/middot/×/‡ in banners, tables and findings
#   B008  — typer's Option()/Argument() defaults are the framework idiom
#   S     — no untrusted input surface; assert/subprocess are deliberate
#   T20   — print() is the CLI's output path
#   PTH   — os.path is used deliberately alongside pathlib (docker/env strings)
select = ["E", "F", "UP", "B", "BLE", "SIM", "C4", "PIE", "RET", "RUF", "PERF", "FURB", "ICN", "ERA", "DTZ"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
# The CuTe-DSL kernel files are traced at compile time and follow
# CUTLASS/FlashAttention conventions; the DSL is sensitive to body/signature
# edits, so their idioms stay: the typing star-import, `Tuple` in @cute.jit
# signatures, dice/atom tuple concatenation, yoda-style tile compares, the
# running log-sum-exp accumulator named `l`, named-but-unused tile loop
# variables, and math comments (GEMM shapes, tile layouts) that read like code.
"src/mjolnir/mjolnir/arch/thor/decode.py" = ["F403", "F405", "E741", "RUF005", "B007", "UP006", "UP035", "SIM300"]
# The Orin mma kernel: DescaleTensors keeps the pre-PEP 604 Optional form the
# DSL tracer expects (moved here from the retired GEMV kernel).
"src/mjolnir/mjolnir/arch/orin/mma.py" = ["UP045"]
"src/mjolnir/mjolnir/arch/thor/call.py" = ["F403", "F405", "ERA001", "RUF005", "RUF059", "UP006", "UP035", "SIM300"]
"src/mjolnir/mjolnir/arch/thor/const.py" = ["RUF005"]
"src/mjolnir/mjolnir/arch/thor/harness.py" = ["F403", "F405", "E741"]
# Triton-jit bodies keep explicit constexpr branches (clearer than the ternary
# and independent of the tracer's handling of conditional expressions)
"src/mjolnir/mjolnir/kvfp6.py" = ["SIM108"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/mjolnir-cli/hatch_build.py"]

[tool.ty.environment]
python-version = "3.12"

# The DSL kernels index Optional parameters behind const_expr() guards the
# type checker cannot see through (the tracer evaluates them at compile
# time) — same rationale as the ruff per-file-ignores above.
[[tool.ty.overrides]]
include = ["src/mjolnir/mjolnir/arch/orin/mma.py"]
rules.not-subscriptable = "ignore"
rules.invalid-assignment = "ignore"

# The kernel and the benchmark drivers run inside the vLLM image: torch, vllm,
# cutlass (CuTe DSL), triton, flashinfer and cuda bindings are provided there
# and deliberately not declared as package deps (multi-GB CUDA stack), so they
# do not resolve in a dev checkout / CI. Suppress the resolution noise for
# those paths — everything else still type-checks.
[[tool.ty.overrides]]
include = ["src/mjolnir/**", "tests/kernel/**", "src/mjolnir-cli/mjolnir_cli/drivers/**"]
rules.unresolved-import = "ignore"
rules.unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# The PR coverage comment (py-cov-action) maps instrumented files onto the
# PR's changed files, so recorded paths must be repo-relative — coverage.py
# defaults to absolute, which the action cannot match.
relative_files = true

# File-length ratchet: covered files may not exceed `limit` lines. Ceilings only
# go down; an entry is removed once its file is <= limit; see AGENTS.md.
# `exclude` carves files out of the ratchet entirely — no ceiling, no floor, not
# measured — and may be added or removed freely (unlike `exempt`, it is not
# ratcheted): the traced CuTe-DSL kernel family, whose size is owned by the
# DSL's tracing constraints, and the generated doc surfaces, whose paths move.
[tool.mjolnir.file-length]
limit = 1000
include = ["*.py", "*.sh", "*.j2", "*.md"]
exclude = [
    "src/mjolnir/mjolnir/arch/thor/decode.py",
    "src/mjolnir/mjolnir/arch/thor/call.py",
    "src/mjolnir/mjolnir/arch/orin/mma.py",
    "docs/platforms/**/*.md",
    "configs/**/README.md",
    "research/runs/**/sources/**",
]
exempt = [
    "README.md",
    "docker/vllm-thor/README.md",
    "docs/cli.md",
]
