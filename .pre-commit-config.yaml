# Gates what ships: both packages under src/ (the wheel contents) + tests/ —
# the same scope as CI. The CuTe-DSL kernel keeps FA naming conventions (e.g. the
# running log-sum-exp accumulator `l`) via per-file ignores in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      # never touch patch/diff files: a whitespace-stripped hunk line changes
      # what the patch applies to (a lone space is a blank source line)
      - id: end-of-file-fixer
        exclude: '\.(patch|diff)$'
      - id: trailing-whitespace
        exclude: '\.(patch|diff)$'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # workflow files only (the hook filters on .github/workflows/ itself);
  # version pinned with the actionlint binary in .github/workflows/ci.yml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/
