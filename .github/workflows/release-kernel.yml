# Release mjolnir-kernel (src/mjolnir, import `mjolnir`) to PyPI.
#
# Tag-driven: runs on a tag `mjolnir-kernel-vX.Y.Z` — pushed by hand, or
# dispatched on the tag by the Release workflow (release.yml), which computes
# the version from the tag history. The tag is the source of truth: the
# version is stamped into `__version__` (src/mjolnir/mjolnir/__init__.py)
# before the build. The CLI has its own tag prefix and workflow
# (release-cli.yml) — the two packages version independently. Docker images
# follow upstream vLLM (docker-image.yml).
#
# One-time human setup (before the first tag):
#   1. pypi.org: add a (pending) trusted publisher for project `mjolnir-kernel`:
#        owner=GoBrrr-ai  repo=mjolnir  workflow=release-kernel.yml  environment=pypi-kernel
#   2. GitHub: Settings -> Environments -> create `pypi-kernel`
#      (optional protection rule: required reviewer).
#   3. GitHub: a tag ruleset for `mjolnir-kernel-v*` (block force-push + delete).
#
# Publish = trusted publishing (OIDC): `environment` + `id-token: write` and
# no user/password inputs on the pypa action.

name: Release mjolnir-kernel

on:
  workflow_dispatch:  # by release.yml, with ref = the tag
  push:
    tags:
      - "mjolnir-kernel-v[0-9]+.[0-9]+.[0-9]+"
      - "mjolnir-kernel-v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "mjolnir-kernel-v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions:
  contents: read

concurrency:
  group: release-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout v7 verifies the tag still points at the triggering commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false  # never cache on a release (cache-poisoning vector)
      - name: Version from the tag, stamped into the package
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_TYPE}" = "tag" ] || { echo "::error::run on a mjolnir-kernel-v* tag, not ${GITHUB_REF}"; exit 1; }
          case "${GITHUB_REF_NAME}" in mjolnir-kernel-v*) ;; *) echo "::error::${GITHUB_REF_NAME} is not a mjolnir-kernel-v* tag"; exit 1;; esac
          version="${GITHUB_REF_NAME#mjolnir-kernel-v}"
          sed -i -E "s/^__version__ = \"[^\"]+\"/__version__ = \"${version}\"/" src/mjolnir/mjolnir/__init__.py
          grep -q "^__version__ = \"${version}\"" src/mjolnir/mjolnir/__init__.py || { echo "::error::could not stamp ${version}"; exit 1; }
          echo "mjolnir-kernel ${version}" >> "$GITHUB_STEP_SUMMARY"
      - name: Lint
        run: uvx ruff@0.14.14 check src/mjolnir
      - name: Build sdist + wheel
        run: uv build --package mjolnir-kernel --out-dir dist
      - name: Smoke-test the wheel (import + vLLM plugin entry point, no torch needed)
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'EOF'
          import importlib.metadata as md
          import mjolnir
          assert mjolnir.BACKEND_PATH == "mjolnir.backend.MjolnirAttentionBackend"
          eps = [e for e in md.entry_points(group="vllm.general_plugins") if e.name == "mjolnir"]
          assert eps and eps[0].value == "mjolnir:register", eps
          print("mjolnir-kernel", mjolnir.__version__, "OK")
          EOF
      - name: Twine check
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-kernel
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi-kernel
      url: https://pypi.org/project/mjolnir-kernel/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-kernel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
