name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:  # the Release workflow runs the same gates before tagging

permissions:
  contents: read
  pull-requests: read  # filter: the PR's file list

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage scopes: on a pull_request each stage runs only when the PR touches
  # the files it guards (docs/CI/template-only PRs skip the code gates).
  # Release (workflow_call) and manual runs always run everything — the
  # filter does not run there, and the stage conditions fall through.
  filter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.f.outputs.lint }}
      lint-workflows: ${{ steps.f.outputs.lint-workflows }}
      test: ${{ steps.f.outputs.test }}
      readme: ${{ steps.f.outputs.readme }}
      build: ${{ steps.f.outputs.build }}
      vllm-patch: ${{ steps.f.outputs.vllm-patch }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: f
        with:
          filters: |
            lint:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
            test:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            readme:
              - 'src/mjolnir-cli/**'
              - 'README.md*'
              - 'docker/vllm-thor/README.md*'
              - 'docs/kernel/**'
              - 'assets/benchmarks/**'
              - 'benchmarks/**'
              - 'pyproject.toml'
              - 'uv.lock'
            build:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'LICENSE'
              - 'NOTICE'
            vllm-patch:
              - 'docker/vllm-thor/**'
            lint-workflows:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'

  lint:
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.lint == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # config in pyproject.toml; version pinned to .pre-commit-config.yaml
      - name: ruff check
        run: uvx ruff@0.14.14 check src/ tests/
      - name: ruff format --check
        run: uvx ruff@0.14.14 format --check src/ tests/

  lint-workflows:
    # actionlint over every workflow file (+ shellcheck on the run: blocks —
    # it's preinstalled on the runner). Same version as the pre-commit hook.
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.lint-workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" | tar xz
          ./actionlint

  test:
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.test == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync
      # the kernel tests need CUDA + the CUTLASS DSL: they run on a Thor via
      # `mjolnir verify vllm`; tests/kernel/conftest.py skips them here
      - run: uv run pytest -q

  readme:
    # README.md + docker/vllm-thor/README.md (the Docker Hub description) +
    # docs/kernel/*.md are rendered from their .md.j2 templates and the
    # committed raw data (benchmarks/raw/verify, history.jsonl) — a hand edit,
    # or raw data committed without re-rendering, fails here.
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.readme == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync
      - name: README + docs are reproducible from the raw data
        run: |
          uv run mjolnir plot --readme
          git diff --exit-code -- README.md docker/vllm-thor/README.md docs/ assets/benchmarks/manifest.json

  build:
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.build == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build both packages (sdist + wheel)
        run: |
          uv build --package mjolnir-kernel --out-dir dist
          uv build --package mjolnir-cli --out-dir dist
      - name: Smoke-test the CLI wheel outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/mjolnir_cli-*.whl mjolnir --help
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/mjolnir_cli-*.whl mjolnir model list
      - name: Smoke-test the kernel wheel (import + plugin entry point)
        run: |
          uv run --isolated --no-project --with dist/mjolnir_kernel-*.whl python -c \
            "import importlib.metadata as m, mjolnir; assert [e for e in m.entry_points(group='vllm.general_plugins') if e.name == 'mjolnir']; print(mjolnir.__version__)"
      - name: Twine check
        run: uvx twine check dist/*

  vllm-patch:
    # The MJOLNIR enum patch must still apply to the vLLM the image is built
    # on (the full patch stack is gated by the image build itself).
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.vllm-patch == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: thor-mjolnir-attention-backend.patch applies to the base vLLM
        run: |
          set -euo pipefail
          v=$(sed -nE 's/^ARG BASE_IMAGE=vllm\/vllm-openai:v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' docker/vllm-thor/Dockerfile)
          git clone -q --depth 1 --branch "v${v}" --filter=blob:none --sparse https://github.com/vllm-project/vllm.git "$RUNNER_TEMP/vllm"
          git -C "$RUNNER_TEMP/vllm" sparse-checkout set vllm/v1/attention/backends
          git apply --check "$GITHUB_WORKSPACE/docker/vllm-thor/patches/thor-mjolnir-attention-backend.patch"
          echo "applies to vLLM v${v}"

  # The only check branch protection should require: a PR's stages skip when
  # out of scope (see filter), and a skipped required check blocks the merge —
  # so this aggregates: green iff every in-scope stage succeeded. PR events
  # only; Release (workflow_call) gates itself on the stages directly.
  enforce-checks:
    if: >-
      github.event_name == 'pull_request' && always() &&
      needs.filter.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.lint-workflows.result == 'success' || needs.lint-workflows.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.readme.result == 'success' || needs.readme.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.vllm-patch.result == 'success' || needs.vllm-patch.result == 'skipped')
    needs: [filter, lint, lint-workflows, test, readme, build, vllm-patch]
    runs-on: ubuntu-latest
    steps:
      - name: In-scope stage results
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "lint-workflows: ${{ needs.lint-workflows.result }}"
          echo "test:           ${{ needs.test.result }}"
          echo "readme:         ${{ needs.readme.result }}"
          echo "build:          ${{ needs.build.result }}"
          echo "vllm-patch:     ${{ needs.vllm-patch.result }}"
