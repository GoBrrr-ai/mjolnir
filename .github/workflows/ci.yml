name: CI

on:
  pull_request:
    # Draft PRs run no gates: the filter self-skips on a draft (below) and the
    # stages skip on its empty outputs; ready_for_review is required because
    # the default types (opened, synchronize, reopened) never fire when a
    # draft is marked ready — without it the gates would not run on that
    # transition at all.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:  # the Release workflow runs the same gates before tagging

permissions:
  contents: read
  pull-requests: read  # filter: the PR's file list

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage scopes: on a pull_request each stage runs only when the PR touches
  # the files it guards (docs/CI/template-only PRs skip the code gates).
  # Draft PRs skip everything. Release (workflow_call) and manual runs always
  # run everything — the filter does not run there, and the stage conditions
  # fall through.
  filter:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.f.outputs.lint }}
      lint-workflows: ${{ steps.f.outputs.lint-workflows }}
      typecheck: ${{ steps.f.outputs.typecheck }}
      test: ${{ steps.f.outputs.test }}
      readme: ${{ steps.f.outputs.readme }}
      build: ${{ steps.f.outputs.build }}
      vllm-patch: ${{ steps.f.outputs.vllm-patch }}
      file-length: ${{ steps.f.outputs.file-length }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            lint:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
            typecheck:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            test:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # the release planner / notes (tests/cli/test_release_plan.py)
              - 'scripts/release_*.py'
              # the file-length checker's own tests (tests/cli)
              - 'scripts/check_file_length.py'
            readme:
              - 'src/mjolnir-cli/**'
              # every template, wherever it lives (README.md.j2 at the repo
              # root, docker/vllm-thor/README.md.j2, docs/templates/**.md.j2) + the
              # generated surfaces a hand edit must trip the check on
              # (per-platform kernel pages, per-model/config READMEs with
              # their Benchmarks sections, the nested per-pair charts)
              - '**/*.md.j2'
              - 'README.md'
              - 'docker/vllm-thor/README.md'
              - 'docs/platforms/**'
              - 'docs/cli.md'
              - 'configs/**'
              - 'assets/benchmarks/**'
              - 'benchmarks/**'
              - 'pyproject.toml'
              - 'uv.lock'
            build:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'LICENSE'
              - 'NOTICE'
            vllm-patch:
              - 'docker/vllm-thor/**'
            lint-workflows:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
            # the file-length ratchet's covered types, wherever they live
            # (docker/vllm-thor/*.py too), plus the rules table in pyproject.toml
            file-length:
              - '**/*.py'
              - '**/*.sh'
              - '**/*.md'
              - '**/*.j2'
              - 'pyproject.toml'

  lint:
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.lint == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # config in pyproject.toml; version pinned to .pre-commit-config.yaml
      - name: ruff check
        run: uvx ruff@0.14.14 check src/ tests/
      - name: ruff format --check
        run: uvx ruff@0.14.14 format --check src/ tests/

  typecheck:
    # ty (Astral — same toolchain as ruff) over the wheel contents + tests,
    # config in pyproject.toml ([tool.ty]). The kernel package and the
    # benchmark drivers import the image-provided CUDA stack (torch, vllm,
    # cutlass, flashinfer) that is deliberately not declared as a dependency —
    # the [tool.ty.overrides] entry keeps that resolution noise out while the
    # rest still checks.
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.typecheck == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run ty check src/ tests/

  lint-workflows:
    # actionlint over every workflow file (+ shellcheck on the run: blocks —
    # it's preinstalled on the runner). Same version as the pre-commit hook.
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.lint-workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" | tar xz
          ./actionlint

  file-length:
    # per-file line limits + the history ratchet (scripts/check_file_length.py,
    # rules in [tool.mjolnir.file-length] in pyproject.toml). On a PR it also
    # compares against the base branch; Release / manual runs check the tree only.
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.file-length == 'true')
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - name: Check file lengths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            uv run scripts/check_file_length.py --base FETCH_HEAD
          else
            uv run scripts/check_file_length.py
          fi

  test:
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.test == 'true')
    runs-on: ubuntu-latest
    # the coverage report below is a PR comment
    permissions:
      contents: read
      pull-requests: write
    env:
      # post the report only on same-repo, non-draft PRs (fork tokens are
      # read-only unless write tokens for forks are enabled)
      REPORT: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      # the kernel tests need CUDA + the CUTLASS DSL: they run on a Thor via
      # `mjolnir verify vllm`; tests/kernel/conftest.py skips them here — the
      # kernel package is therefore not measurable in CI, the CLI is. --cov also
      # writes the .coverage data file the report action reads; the XML is the
      # Cobertura form and term-missing is a per-file table in the job log
      - run: uv run --with pytest-cov pytest -q --tb=short --cov=mjolnir_cli --cov-report=term-missing --cov-report=xml:coverage.xml
      # Coverage report on the PR: an upserted comment + annotations on the
      # new lines missing coverage. This stage is path-gated, so docs/CI-only
      # PRs get neither suite nor report; the report is informational — a
      # failure to render or post it must not gate the suite. No baseline data
      # branch is maintained: without a default-branch run the action reports
      # the current coverage but no up/down delta.
      - name: Verify coverage data exists
        if: ${{ env.REPORT == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f .coverage || { echo "::error::.coverage not found — pytest must run with --cov"; exit 1; }
          uv run --with coverage coverage debug data | head -8
      - name: Coverage report (comment + annotations)
        if: ${{ env.REPORT == 'true' }}
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # no ACTIVITY override: on a closed (unmerged) PR the action's own
          # heuristic is a no-op; forcing process_pr would comment on closed PRs
          ANNOTATE_MISSING_LINES: true
          ANNOTATION_TYPE: warning
          # badge colors only (the action never fails on coverage); aspirational
          # above the current ~61%
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

  readme:
    # README.md + docker/vllm-thor/README.md (the Docker Hub description) +
    # docs/platforms/** (the per-platform kernel case study) +
    # configs/**/README.md (with the Benchmarks section) are rendered from
    # their .md.j2 templates and the committed raw data
    # (benchmarks/raw/verify, history.jsonl) — a hand edit, or raw data
    # committed without re-rendering, fails here.
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.readme == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - name: README + docs are reproducible from the raw data
        run: |
          uv run mjolnir plot --readme
          git diff --exit-code -- README.md docker/vllm-thor/README.md docs/ configs/ assets/benchmarks/manifest.json

  build:
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.build == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build both packages (sdist + wheel)
        run: |
          uv build --package mjolnir-kernel --out-dir dist
          uv build --package mjolnir-cli --out-dir dist
      - name: Smoke-test the CLI wheel outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/mjolnir_cli-*.whl mjolnir --help
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/mjolnir_cli-*.whl mjolnir model list
      - name: Smoke-test the kernel wheel (import + plugin entry point)
        run: |
          uv run --isolated --no-project --with dist/mjolnir_kernel-*.whl python -c \
            "import importlib.metadata as m, mjolnir; assert [e for e in m.entry_points(group='vllm.general_plugins') if e.name == 'mjolnir']; print(mjolnir.__version__)"
      - name: Twine check
        run: uvx twine check dist/*

  vllm-patch:
    # The MJOLNIR enum patch must still apply to the vLLM the image is built
    # on (the full patch stack is gated by the image build itself).
    needs: filter
    if: always() && (github.event_name != 'pull_request' || needs.filter.outputs.vllm-patch == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: thor-mjolnir-attention-backend.patch applies to the base vLLM
        run: |
          set -euo pipefail
          v=$(sed -nE 's/^ARG BASE_IMAGE=vllm\/vllm-openai:v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' docker/vllm-thor/Dockerfile)
          git clone -q --depth 1 --branch "v${v}" --filter=blob:none --sparse https://github.com/vllm-project/vllm.git "$RUNNER_TEMP/vllm"
          git -C "$RUNNER_TEMP/vllm" sparse-checkout set vllm/v1/attention/backends
          cd "$RUNNER_TEMP/vllm"
          git apply --check "$GITHUB_WORKSPACE/docker/vllm-thor/patches/thor-mjolnir-attention-backend.patch"
          echo "applies to vLLM v${v}"

  # The only check branch protection should require: a PR's stages skip when
  # out of scope (see filter), and a skipped required check blocks the merge —
  # so this aggregates: green iff every in-scope stage succeeded. Draft PRs
  # skip too (nothing ran to aggregate). PR events only; Release
  # (workflow_call) gates itself on the stages directly.
  enforce-checks:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft != true && always() &&
      needs.filter.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.lint-workflows.result == 'success' || needs.lint-workflows.result == 'skipped') &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.readme.result == 'success' || needs.readme.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.vllm-patch.result == 'success' || needs.vllm-patch.result == 'skipped') &&
      (needs.file-length.result == 'success' || needs.file-length.result == 'skipped')
    needs: [filter, lint, lint-workflows, typecheck, file-length, test, readme, build, vllm-patch]
    runs-on: ubuntu-latest
    steps:
      - name: In-scope stage results
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "lint-workflows: ${{ needs.lint-workflows.result }}"
          echo "typecheck:      ${{ needs.typecheck.result }}"
          echo "test:           ${{ needs.test.result }}"
          echo "readme:         ${{ needs.readme.result }}"
          echo "build:          ${{ needs.build.result }}"
          echo "vllm-patch:     ${{ needs.vllm-patch.result }}"
          echo "file-length:    ${{ needs.file-length.result }}"
