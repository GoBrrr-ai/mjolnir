# Release mjolnir-cli (src/mjolnir-cli, import `mjolnir_cli`, command
# `mjolnir`) to PyPI.
#
# Tag-gated: push a tag `mjolnir-cli-vX.Y.Z` whose version equals
# `__version__` in src/mjolnir-cli/mjolnir_cli/__init__.py. Independent of
# the kernel's version (release-kernel.yml) and of the image (docker-image.yml).
#
# One-time human setup (before the first tag):
#   1. pypi.org: add a *pending* trusted publisher for project `mjolnir-cli`:
#        owner=thor-arena  repo=mjolnir  workflow=release-cli.yml  environment=pypi-cli
#   2. GitHub: Settings -> Environments -> create `pypi-cli`.
#   3. GitHub: a tag ruleset for `mjolnir-cli-v*` (block force-push + delete).

name: Release mjolnir-cli

on:
  push:
    tags:
      - "mjolnir-cli-v[0-9]+.[0-9]+.[0-9]+"
      - "mjolnir-cli-v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "mjolnir-cli-v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Tag is at HEAD and matches the package version
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_NAME}" = "$(git describe --tags --exact-match HEAD)" ] \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not at HEAD"; exit 1; }
          want="${GITHUB_REF_NAME#mjolnir-cli-v}"
          have=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/mjolnir-cli/mjolnir_cli/__init__.py)
          [ "$want" = "$have" ] || { echo "::error::tag $want != src/mjolnir-cli/mjolnir_cli/__init__.py $have"; exit 1; }
      - name: Lint
        run: |
          uvx ruff@0.14.14 check src/mjolnir-cli
          uvx ruff@0.14.14 format --check src/mjolnir-cli
      - name: Test
        run: |
          uv sync
          uv run pytest -q tests/cli
      - name: Build sdist + wheel (bundles configs/ + the side stacks)
        run: uv build --package mjolnir-cli --out-dir dist
      - name: Smoke-test the wheel outside a checkout (the PyPI experience)
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl mjolnir --help
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl mjolnir model list
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl mjolnir verify sweep --dry-run --ls 8192 --no-gate
      - name: Twine check
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-cli
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi-cli
      url: https://pypi.org/project/mjolnir-cli/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-cli
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
