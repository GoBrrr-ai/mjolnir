# Release mjolnir-cli (src/mjolnir-cli, import `mjolnir_cli`, command
# `mjolnir`) to PyPI.
#
# Tag-driven: runs on a tag `mjolnir-cli-vX.Y.Z` — pushed by hand, or
# dispatched on the tag by the Release workflow (release.yml), which computes
# the version from the tag history. The tag is the source of truth: the
# version is stamped into `__version__` (src/mjolnir-cli/mjolnir_cli/__init__.py)
# before the build. Independent of the kernel's version (release-kernel.yml)
# and of the image (docker-image.yml).
#
# One-time human setup (before the first tag):
#   1. pypi.org: add a (pending) trusted publisher for project `mjolnir-cli`:
#        owner=thor-arena  repo=mjolnir  workflow=release-cli.yml  environment=pypi-cli
#   2. GitHub: Settings -> Environments -> create `pypi-cli`.
#   3. GitHub: a tag ruleset for `mjolnir-cli-v*` (block force-push + delete).

name: Release mjolnir-cli

on:
  workflow_dispatch:  # by release.yml, with ref = the tag
  push:
    tags:
      - "mjolnir-cli-v[0-9]+.[0-9]+.[0-9]+"
      - "mjolnir-cli-v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "mjolnir-cli-v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Version from the tag, stamped into the package
        run: |
          set -euo pipefail
          [ "${GITHUB_REF_TYPE}" = "tag" ] || { echo "::error::run on a mjolnir-cli-v* tag, not ${GITHUB_REF}"; exit 1; }
          case "${GITHUB_REF_NAME}" in mjolnir-cli-v*) ;; *) echo "::error::${GITHUB_REF_NAME} is not a mjolnir-cli-v* tag"; exit 1;; esac
          version="${GITHUB_REF_NAME#mjolnir-cli-v}"
          sed -i -E "s/^__version__ = \"[^\"]+\"/__version__ = \"${version}\"/" src/mjolnir-cli/mjolnir_cli/__init__.py
          grep -q "^__version__ = \"${version}\"" src/mjolnir-cli/mjolnir_cli/__init__.py || { echo "::error::could not stamp ${version}"; exit 1; }
          echo "mjolnir-cli ${version}" >> "$GITHUB_STEP_SUMMARY"
      - name: Lint
        run: |
          uvx ruff@0.14.14 check src/mjolnir-cli
          uvx ruff@0.14.14 format --check src/mjolnir-cli
      - name: Test
        run: |
          uv sync
          uv run pytest -q tests/cli
      - name: Build sdist + wheel (bundles configs/ + the side stacks)
        run: uv build --package mjolnir-cli --out-dir dist
      - name: Smoke-test the wheel outside a checkout (the PyPI experience)
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl mjolnir --help
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl mjolnir model list
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl mjolnir verify sweep --dry-run --ls 8192 --no-gate
      - name: Twine check
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-cli
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi-cli
      url: https://pypi.org/project/mjolnir-cli/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-cli
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
