name: PR summary

# Coverage report on every non-draft PR: runs the CLI test suite with
# pytest-cov and posts (or replaces) one comment. Informational only —
# the CI workflow carries the required checks, this one never gates.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # ready_for_review = un-drafted

permissions:
  contents: read
  pull-requests: write  # the comment

concurrency:
  group: pr-summary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync
      # The kernel tests need a Thor (torch + the CUTLASS DSL) and are skipped
      # in CI — the CLI package is what this report measures.
      - name: Measure coverage
        run: uv run --with pytest-cov pytest -q --cov=mjolnir_cli --cov-report=json:coverage.json
      - name: Render the report
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          cov = json.load(open("coverage.json"))
          files, totals = cov["files"], cov["totals"]
          total = totals["percent_covered"]

          # the PR diff (base tip -> this head), restricted to the measured package
          out = subprocess.run(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD", "--", "src/mjolnir-cli/"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          changed = [p for p in sorted(out) if p.endswith(".py")]
          rows = [(p, files[p]["summary"]["percent_covered"]) for p in changed if p in files]

          def bar(pct, width=20):
              n = round(pct / 100 * width)
              return "█" * n + "░" * (width - n)

          L = [
              "<!-- pr-summary:coverage -->",
              "## Coverage",
              "",
              f"**`mjolnir_cli`: {total:.1f}%** `{bar(total)}` "
              f"({totals['covered_lines']:,} / {totals['num_statements']:,} statements)",
              "",
          ]
          if rows:
              L += ["**Changed files**", "", "| file | coverage |", "| --- | ---: |"]
              L += [f"| `{p}` | {c:.1f}% |" for p, c in rows]
          unmeasured = [p for p in changed if p not in files]
          if unmeasured:
              L += ["", "_Not measured (not exercised by the tests): " +
                    ", ".join(f"`{p}`" for p in unmeasured) + "_"]
          if not rows and not unmeasured:
              L.append("_No Python files under `src/mjolnir-cli/` changed._")
          L += [
              "",
              f"_head `{os.environ['HEAD_SHA'][:7]}` — kernel tests need a Thor and are "
              "skipped in CI, so only the CLI package is measured; re-runs replace this comment._",
          ]
          open("comment.md", "w").write("\n".join(L) + "\n")
          PY
      # the marker (first line of the report) locates the previous comment,
      # so a new push replaces it instead of stacking comments
      - name: Find the previous report
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- pr-summary:coverage -->'
      - name: Post the coverage report
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md
          edit-mode: replace
