[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mjolnir-cli"
dynamic = ["version"]
description = "Serve, benchmark and document LLMs on NVIDIA Jetson AGX Thor: YAML model configs, the Mjolnir vLLM image, KV-cache calibration, kernel / serving / accuracy benchmarks and auto-rendered reports."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mieszko Syty", email = "mieszko@ms1design.pl" }]
keywords = ["vllm", "llm", "serving", "jetson", "thor", "sm110", "benchmark", "ncu", "cli", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "typer>=0.12",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10.9"]

[project.urls]
Homepage = "https://github.com/thor-arena/mjolnir"
Documentation = "https://github.com/thor-arena/mjolnir/tree/main/docs"
Repository = "https://github.com/thor-arena/mjolnir.git"
Issues = "https://github.com/thor-arena/mjolnir/issues"
Changelog = "https://github.com/thor-arena/mjolnir/releases"
"CLI reference" = "https://github.com/thor-arena/mjolnir/blob/main/docs/cli.md"

# The distribution is `mjolnir-cli`; the command is still `mjolnir`.
[project.scripts]
mjolnir = "mjolnir_cli.cli:app"

[tool.hatch.version]
path = "mjolnir_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mjolnir_cli"]

# The repo's model configs ship inside the wheel so a PyPI install can serve
# the default model without a checkout (a checkout's configs/ still wins).
# hatch_build.py copies <repo>/configs in when it exists (a checkout); a
# wheel built from the sdist finds them already under mjolnir_cli/bundled/.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["mjolnir_cli", "README.md", "hatch_build.py", "LICENSE", "NOTICE"]
