[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mjolnir-kernel"
dynamic = ["version"]
description = "Mjolnir: a paged decode-attention kernel for NVIDIA Jetson AGX Thor (sm_110) on tcgen05 / TMEM / TMA (CuTe DSL), with fp8 and 6-bit (e2m3) KV caches — packaged as the vLLM MJOLNIR attention backend."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mieszko Syty", email = "mieszko@ms1design.pl" }]
keywords = ["vllm", "attention", "decode", "jetson", "thor", "sm110", "blackwell", "cute-dsl", "tcgen05", "fp8"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime deps (torch, vllm, nvidia-cutlass-dsl, flashinfer) come from the
# vLLM image the kernel runs in — they are deliberately NOT declared here, so
# installing the plugin never pulls (or replaces) a multi-GB CUDA stack.
dependencies = []

[project.optional-dependencies]
dsl = ["nvidia-cutlass-dsl>=4.2"]

[project.urls]
Homepage = "https://github.com/GoBrrr-ai/mjolnir"
Documentation = "https://github.com/GoBrrr-ai/mjolnir/tree/main/docs/kernel"
Repository = "https://github.com/GoBrrr-ai/mjolnir.git"
Issues = "https://github.com/GoBrrr-ai/mjolnir/issues"
Changelog = "https://github.com/GoBrrr-ai/mjolnir/releases"

# vLLM loads general plugins in every process; register() maps the MJOLNIR
# (patched vLLM) and CUSTOM (stock vLLM) backend enum members to the class.
[project.entry-points."vllm.general_plugins"]
mjolnir = "mjolnir:register"

[tool.hatch.version]
path = "mjolnir/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mjolnir"]

[tool.hatch.build.targets.sdist]
include = ["mjolnir", "README.md", "LICENSE", "NOTICE"]
